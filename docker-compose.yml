# Environnement de développement complet : `docker compose up`
# Rien d'autre que Docker n'est requis sur l'hôte.

x-node-dev: &node-dev
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: deskflow-node-dev
  init: true # PID 1 propre : relaie les signaux, supprime les zombies
  env_file:
    - path: .env
      required: false
  volumes:
    - .:/app
    - pnpm-store:/pnpm/store

services:
  # Conteneur utilitaire pour pnpm / CLIs : `bin/pnpm …` ou `bin/sh`
  tools:
    <<: *node-dev
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Recompile packages/shared à chaque modification : l'api et le front consomment sa version
  # compilée (dist/, construite une première fois par `pnpm install`)
  shared:
    <<: *node-dev
    command: ["pnpm", "--filter", "@deskflow/shared", "dev"]

  api:
    <<: *node-dev
    command: ["pnpm", "--filter", "api", "start:dev"]
    environment:
      PORT: 3001
    ports:
      # Plage de ports : avec `docker compose up --scale api=2`, chaque instance reçoit le sien
      # (3001 et 3002), pour pouvoir viser l'une ou l'autre
      - "${API_PORTS:-3001-3002}:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-setup: { condition: service_completed_successfully }
    healthcheck:
      # Pas de curl dans l'image slim : on utilise le fetch natif de Node
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s # laisse le temps à la compilation en mode watch

  # Exécute les jobs (e-mails, tâches planifiées) ajoutés par l'api dans Redis.
  # Même code que l'api, autre point d'entrée (src/worker.ts), sans serveur HTTP.
  # Plusieurs instances possibles : `docker compose up --scale worker=2`
  worker:
    <<: *node-dev
    command: ["pnpm", "--filter", "api", "start:worker:dev"]
    # Laisse au job en cours le temps de se terminer avant l'arrêt forcé
    stop_grace_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3-setup: { condition: service_completed_successfully }

  web:
    <<: *node-dev
    command: ["pnpm", "--filter", "web", "dev"]
    environment:
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskflow}
      POSTGRES_DB: ${POSTGRES_DB:-deskflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 : les données vivent dans /var/lib/postgresql/<version>/
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage objet compatible S3 (remplace MinIO, dont les images ne sont plus publiées)
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data", "-bucket=${S3_BUCKET:-attachments}"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-deskflow}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-deskflow-secret}
    ports:
      - "${S3_PORT:-8333}:8333" # API S3
      - "${S3_ADMIN_PORT:-23646}:23646" # Admin UI
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Prépare le bucket (création, CORS limité au front) puis s'arrête ; idempotent
  s3-setup:
    <<: *node-dev
    command: ["pnpm", "storage:setup"]
    depends_on:
      s3: { condition: service_healthy }

  # Capture tous les e-mails envoyés en dev : UI sur http://localhost:8026
  # (8026 et non 8025, le port par défaut de Mailpit, souvent déjà pris par un autre projet)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  postgres-data:
  redis-data:
  s3-data:
  pnpm-store:
