name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Base réelle pour les tests e2e de l'api (même image qu'en local)
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: deskflow
          POSTGRES_PASSWORD: deskflow
          POSTGRES_DB: deskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://deskflow:deskflow@localhost:5432/deskflow
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v7

      # Version de pnpm lue dans le champ packageManager du package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:deploy

      - name: E2E tests (api)
        run: pnpm --filter api test:e2e
