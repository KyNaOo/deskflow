name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Base et Redis réels pour les tests e2e de l'api (mêmes images qu'en local)
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: deskflow
          POSTGRES_PASSWORD: deskflow
          POSTGRES_DB: deskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://deskflow:deskflow@localhost:5432/deskflow
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:8333
      S3_PUBLIC_URL: http://localhost:8333
      S3_BUCKET: attachments
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # Aucun e-mail réellement envoyé : les tests lisent les jobs de la file, ou mockent l'envoi du worker
      SMTP_URL: smtp://localhost:1025
      WEB_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      # Version de pnpm lue dans le champ packageManager du package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Lancé à la main : un service GitHub Actions ne peut pas recevoir d'arguments (`mini`)
      - name: Start S3 storage (SeaweedFS)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY -e AWS_SECRET_ACCESS_KEY=$S3_SECRET_KEY \
            chrislusf/seaweedfs:latest mini -dir=/data -bucket=$S3_BUCKET
          timeout 60 sh -c 'until curl -sf http://localhost:8333/healthz; do sleep 2; done'

      - name: Apply migrations
        run: pnpm db:deploy

      - name: E2E tests (api)
        run: pnpm --filter api test:e2e
